# CI BuildStream user config. No cache quota: a build's working set
# (SDK build dependencies plus outputs) exceeds any quota that would fit two
# arches in the 10 GB Actions cache, and BuildStream fails builds at quota.
# bst-cache.yml caps what gets saved instead.
scheduler:
  network-retries: 5

# Fetch sources from the Bluefin source cache only. FSDK's own project source
# cache (cache.freedesktop-sdk.io) stalls CI fetches.
source-caches:
  override-project-caches: true
  servers:
  - url: https://cache.projectbluefin.io:11001
