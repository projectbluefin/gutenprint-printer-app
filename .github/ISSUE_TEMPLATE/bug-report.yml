name: "Bug report"
description: "Tell us what went wrong in Gutenprint Printer Application and how to reproduce it."
labels: ["needs-triage", "kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Help us understand the bug

        Use a short, specific issue title. Describe one problem per report and remove
        passwords, tokens, serial numbers, and other private information from evidence.

        ## What happens next

        This report starts in `needs-triage`. A maintainer will read it, ask for missing
        information if needed, and decide whether to accept implementation work.
        Welcoming machine analysis is **not** approval to implement a change.

        See the [Gutenprint issue lifecycle](https://github.com/projectbluefin/gutenprint-printer-app/blob/testing/docs/issue-lifecycle.md).

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Summarize the bug, its impact, and when it began. Include relevant printer model and connection details."
      placeholder: "When I…, I see… This prevents me from…"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
      description: "Describe the behavior you expected instead."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Give the smallest repeatable set of steps. If it is intermittent or you cannot reproduce it, explain what you tried."
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: "Image details"
      description: "Provide the image tag or digest you are running (for example: ghcr.io/projectbluefin/gutenprint-printer-app:5.3.6-4.2) and container host environment."
      placeholder: "Paste image reference and host environment details here."
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "Additional evidence"
      description: "Optional: relevant logs, screenshots, error messages, or CUPS/PAPPL output. Redact private information before sharing."
    validations:
      required: false

  - type: dropdown
    id: automation-preference
    attributes:
      label: "Automation preference"
      description: "Choose how you want this report analyzed. Human interaction only asks us not to use machine analysis or agent implementation; routine status and label automation still runs. A maintainer must separately accept any implementation work."
      options:
        - "Human interaction only"
        - "Machine analysis is welcome"
        - "No preference"
    validations:
      required: true
