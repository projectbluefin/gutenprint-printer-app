name: "Bug report"
description: "Tell us what went wrong in Gutenprint Printer Application and how to reproduce it."
labels: ["needs-human", "kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Help us understand the bug

        Use a short, specific issue title. Describe one problem per report and remove
        passwords, tokens, serial numbers, and other private information from evidence.

        ## What happens next

        A maintainer reads every report. Once it is accepted, it can be picked up
        for work. You don't need labels or commands; just reply normally.

        See [Prow commands](https://github.com/cncf/prow-github-actions/blob/v3.0.1/docs/commands.md) for triage and review.

  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Summarize the bug, its impact, and when it began. Include relevant printer model and connection details."
      placeholder: "When I…, I see… This prevents me from…"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect?"
      description: "Describe the behavior you expected instead."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Give the smallest repeatable set of steps. If it is intermittent or you cannot reproduce it, explain what you tried."
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: "Image details"
      description: "Provide the image tag or digest you are running (for example: ghcr.io/projectbluefin/gutenprint-printer-app:5.3.6-4.2) and container host environment."
      placeholder: "Paste image reference and host environment details here."
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "Additional evidence"
      description: "Optional: relevant logs, screenshots, error messages, or CUPS/PAPPL output. Redact private information before sharing."
    validations:
      required: false

  - type: dropdown
    id: automation-preference
    attributes:
      label: "Automation preference"
      description: "Choose how you want this report handled. Human interaction only means maintainers keep `needs-human` on this issue, so agents never pick it up."
      options:
        - "Human interaction only"
        - "Machine analysis is welcome"
        - "No preference"
    validations:
      required: true
