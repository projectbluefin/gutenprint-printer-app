name: "Feature request"
description: "Describe a problem the Gutenprint Printer Application could solve and the outcome you need."
labels: ["needs-triage", "kind/feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## Start with the problem

        Use a short, specific issue title. Tell us who is affected and what would improve
        their printing experience. You do not need technical design or final acceptance
        criteria to suggest a feature.

        ## What happens next

        This request starts in `needs-triage`. A maintainer will read it, clarify scope
        if needed, and decide whether to accept implementation work.

        See the [Gutenprint issue lifecycle](https://github.com/projectbluefin/gutenprint-printer-app/blob/testing/docs/issue-lifecycle.md).

  - type: textarea
    id: problem
    attributes:
      label: "Problem to solve"
      description: "What are you trying to do, who is affected, and what gets in the way?"
      placeholder: "As someone who…, I need to…, but currently…"
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "Desired outcome"
      description: "Describe what success would look like. A concrete printer model or driver example is helpful."
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: "Affected component"
      description: "Which part of the printer app is involved? (e.g., driver PPD, web admin, calibration, dye-sub USB backend)"
      placeholder: "For example: Epson driver, web admin settings, or unsure"
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: "Current workaround"
      description: "How do you handle this today, and what are its limitations? Say none if you have no workaround."
    validations:
      required: false

  - type: dropdown
    id: automation-preference
    attributes:
      label: "Automation preference"
      description: "Choose how you want this request analyzed. Human interaction only asks us not to use machine analysis or agent implementation; routine status and label automation still runs. A maintainer must separately accept any implementation work."
      options:
        - "Human interaction only"
        - "Machine analysis is welcome"
        - "No preference"
    validations:
      required: true
