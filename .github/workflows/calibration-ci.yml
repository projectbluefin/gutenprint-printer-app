name: Calibration CI

# Real-image verification for issue #13: the built OCI image must retain the
# Gutenprint colour-calibration utility, the scan target it opens, and the
# translated catalogues its PPD generator consumes -- and a hardware-free
# invocation must load that data with no missing library or asset errors.
# A cheap static guard runs first and fails fast on a recipe regression
# without any build tooling; the runtime job then builds the real rock and
# loads the calibration data inside it (no printer, no synthetic echo).
on:
  push:
    branches: [testing]
    paths:
      - .github/workflows/calibration-ci.yml
      - rockcraft.yaml
      - snap/snapcraft.yaml
      - elements/**
      - tests/check-calibration-retention.sh
      - tests/calibration-payload.sh
      - docs/calibration-payload.md
  pull_request:
    branches: [testing]
    paths:
      - .github/workflows/calibration-ci.yml
      - rockcraft.yaml
      - snap/snapcraft.yaml
      - elements/**
      - tests/check-calibration-retention.sh
      - tests/calibration-payload.sh
      - docs/calibration-payload.md
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  static-guard:
    name: Guard calibration payload retention
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the recipes still prime the calibration payload
        run: bash tests/check-calibration-retention.sh

  calibration-verify:
    name: Build & verify calibration payload
    needs: static-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo snap install rockcraft --classic
          sudo apt-get update
          sudo apt-get install --yes podman skopeo fuse3

      - name: Build rock
        uses: canonical/craft-actions/rockcraft-pack@main
        id: rockcraft

      - name: Load rock into podman
        run: |
          set -euo pipefail
          ROCK="${{ steps.rockcraft.outputs.rock }}"
          skopeo copy --insecure-policy oci-archive:"${ROCK}" docker-archive:/tmp/gutenprint.tar
          podman load -i /tmp/gutenprint.tar
          IMG="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep gutenprint-printer-app | head -n1)"
          podman tag "$IMG" gutenprint-printer-app:build

      - name: Run calibration payload verification
        run: bash tests/calibration-payload.sh
        env:
          IMAGE: gutenprint-printer-app:build
