name: issue lifecycle

# Wired for projectbluefin/gutenprint-printer-app as the reviewed issue-routing entry point
# (projectbluefin/common#1224). Mirrors the caller already reviewed and live in
# projectbluefin/bluefin, bluefin-lts, and dakota: a narrow workflow_call into
# the SHA-pinned bonedigger lifecycle.
#
# Pinned to v1 (d53076732c23203efd7856eaee7c502742897603) — the tagged stable release proven in bluefin +
# bluefin-lts. The printer forks take this tagged pin rather than 9c5faf6 (dakota's
# newer, untagged pin, PR #36 "require diagnostic Gists"), which is a reporter-UX
# change outside this issue's routing scope. If maintainers want that newer
# behavior, bump the pin after 9c5faf6 is tagged.

# Triggers are deliberately narrower than they look like they could be. The
# pinned bonedigger lifecycle has exactly two jobs, `issues.opened` and
# `issue_comment.created`, so subscribing to any other activity type dispatches
# the reusable workflow only to skip every job in it (bluefin#981). Widen this
# only alongside a bonedigger release that actually handles the new type.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Scoped to what the callee declares (issues: write, contents: read). It reads
# `event.issue.pull_request` straight from the payload and never calls the pulls
# API, so no pull-requests scope is needed.
permissions:
  issues: write
  contents: read

jobs:
  lifecycle:
    uses: projectbluefin/bonedigger/.github/workflows/lifecycle.yml@d53076732c23203efd7856eaee7c502742897603 # v1
    with:
      brand_name: "Gutenprint Printer App"
      brand_emoji: "🖨️"
