name: Validate FSDK Gutenprint OCI image

on:
  pull_request:
    branches: [testing, stable]
  push:
    branches: [testing]
  merge_group:
  workflow_dispatch:
    inputs:
      publish_runtime_proof:
        description: "Publish unique ${ARCH}-runtime-proof-${RUN_ID} tag to verify pull-time layer preservation"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    name: Native image and socket print (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      FULL_BUILD: ${{ github.event_name != 'pull_request' }}
      # Every bst call, including those inside just recipes, uses the CI
      # user config (source cache override, network retries).
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      - name: Validate BuildStream graph
        if: env.FULL_BUILD != 'true'
        run: just validate
      # Restore only: pull_request and merge_group caches are scoped to their
      # own ref, so bst-cache.yml on testing is the only writer.
      - name: Compute BuildStream cache key
        id: bst-key
        if: env.FULL_BUILD == 'true'
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'gutenprint-printer-app.c', 'gutenprint-printer-app.1', 'gutenprint-printer-app.service', 'testpage.ps') }}
        run: echo "hash=${INPUTS_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        if: env.FULL_BUILD == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-
            bst-v1-${{ matrix.arch }}-
      - name: Install cosign
        if: env.FULL_BUILD == 'true'
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        if: env.FULL_BUILD == 'true'
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      # Seed the shared printing runtime layer into files/runtime-layer/${ARCH}
      # for build-oci parent.image. Never fallback-extract an unsigned parent:
      # verification failure aborts the step.
      - name: Seed printing runtime layer
        if: env.FULL_BUILD == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
            x86_64)
              oci_arch="amd64"
              expected_leaf="sha256:94e3c6833dc6c14c03fafc56d3a4b3c4a283f882a05005d4967862c1be9c0882"
              ;;
            aarch64)
              oci_arch="arm64"
              expected_leaf="sha256:e8c1617526dd88ade763ef4c621e13b48353e75b132ca4bf219740b9e1a07c47"
              ;;
            *)
              echo "Unknown architecture: ${ARCH}" >&2
              exit 1
              ;;
          esac

          REPO="ghcr.io/projectbluefin/printing-runtime-layer"
          INDEX_DIGEST="sha256:15752aefb1d43262bf75123968b39b2e610e3996c11088a246995a3808eec51f"

          # Verify signature on multi-arch index before reading or copying
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${INDEX_DIGEST}" >/dev/null

          # Verify index contains the expected architecture leaf manifest
          leaf="$(skopeo inspect --raw "docker://${REPO}@${INDEX_DIGEST}" | jq -r --arg a "$oci_arch" '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux") | .digest')"
          if [[ "${leaf}" != "${expected_leaf}" ]]; then
            echo "::error::Leaf manifest digest ${leaf} does not match expected ${expected_leaf} for ${oci_arch}"
            exit 1
          fi

          # Seed exact leaf manifest to local OCI layout using --preserve-digests
          target_dir="files/runtime-layer/${ARCH}"
          rm -rf "${target_dir}"
          mkdir -p "${target_dir}"
          skopeo copy --preserve-digests --override-arch "${oci_arch}" --override-os linux \
            "docker://${REPO}@${INDEX_DIGEST}" "oci:${target_dir}:layer"
      - name: Build image
        if: env.FULL_BUILD == 'true'
        run: just bst --network-retries 5 build oci/gutenprint-printer-app.bst
      - name: Build actual image and print Epson raster to socket sink
        if: env.FULL_BUILD == 'true'
        run: just verify
      # Pull-time proof (isolated proof topic only): push unique proof tag
      # ${ARCH}-runtime-proof-${RUN_ID} to verify that remote GHCR publication
      # preserves the Layer 0 blob without recompression or digest mutation.
      - name: Publish and verify runtime layer pull-time proof
        if: github.event_name == 'workflow_dispatch' && inputs.publish_runtime_proof == true && github.ref == 'refs/heads/feat/shared-runtime-layer-proof'
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ghcr.io
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
            x86_64)
              oci_arch="amd64"
              expected_blob="sha256:48f4771e199eead682c592e87c043c2389670e5b84e8d35cc40204e3b24fcd4f"
              ;;
            aarch64)
              oci_arch="arm64"
              expected_blob="sha256:ab5ecb38c3290228a32ec8b8ec1453738ce66ffb0557deab3b71172236ae4836"
              ;;
            *)
              echo "Unknown architecture: ${ARCH}" >&2
              exit 1
              ;;
          esac

          TAG="${ARCH}-runtime-proof-${RUN_ID}"
          TARGET="ghcr.io/projectbluefin/gutenprint-printer-app:${TAG}"
          PUBLISH_DIR=".build-out-publish"

          echo "Publishing proof for ${ARCH} (OCI ${oci_arch})..."

          # Re-checkout already tested/cached OCI artifact directly to .build-out
          rm -rf .build-out
          just bst artifact checkout oci/gutenprint-printer-app.bst --directory /src/.build-out

          # Assemble OCI layout carrying original compressed Layer 0 blob and child Layer 1/config
          rm -rf "${PUBLISH_DIR}"
          python3 scripts/assemble_runtime_layer_proof.py \
            --build-out .build-out \
            --parent-dir "files/runtime-layer/${ARCH}" \
            --output "${PUBLISH_DIR}" \
            --tag "${TAG}"
          rm -rf .build-out

          echo "Logging in to ${REGISTRY} via skopeo..."
          echo "${GH_TOKEN}" | skopeo login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin

          echo "Copying OCI layout to ${TARGET} with --preserve-digests (no VERSION/stable/latest)..."
          skopeo copy --preserve-digests "oci:${PUBLISH_DIR}:${TAG}" "docker://${TARGET}"

          echo "Inspecting remotely published manifest via skopeo..."
          remote_manifest="$(skopeo inspect --raw "docker://${TARGET}")"
          echo "${remote_manifest}" | jq .

          remote_layers="$(jq '.layers | length' <<< "${remote_manifest}")"
          if [[ "${remote_layers}" -ne 2 ]]; then
            echo "::error::Published remote manifest has ${remote_layers} layers; expected exactly 2"
            exit 1
          fi

          remote_layer0="$(jq -r '.layers[0].digest' <<< "${remote_manifest}")"
          if [[ "${remote_layer0}" != "${expected_blob}" ]]; then
            echo "::error::Published remote Layer 0 digest ${remote_layer0} does not match producer blob ${expected_blob}"
            exit 1
          fi

          echo "PULL-TIME PROOF VERIFIED: ${TARGET} published with 2 layers and exact producer Layer 0 blob (${remote_layer0})."
