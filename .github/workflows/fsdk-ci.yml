name: Validate FSDK Gutenprint OCI image

on:
  pull_request:
    branches: [testing, stable]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    name: Native image and socket print (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      FULL_BUILD: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Validate BuildStream graph
        if: env.FULL_BUILD != 'true'
        run: just validate
      - name: Build image
        if: env.FULL_BUILD == 'true'
        run: just bst --network-retries 5 build oci/gutenprint-printer-app.bst
      - name: Build actual image and print Epson raster to socket sink
        if: env.FULL_BUILD == 'true'
        run: just verify
