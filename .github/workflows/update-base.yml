name: Update fsdk-containers base

# Keep the fsdk-containers junction (and with it FSDK and the shared printing
# base) current. FSDK is reached only through fsdk-containers, so this is the
# one dependency updater for it.
on:
  schedule:
    - cron: '3 8 * * *'
  workflow_dispatch:

concurrency:
  group: update-base
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Track fsdk-containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: testing
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Track fsdk-containers
        id: track
        run: |
          set -euo pipefail
          junction=elements/fsdk-containers.bst
          commit() { sed -n -E 's/^ +ref: .*([0-9a-f]{40})$/\1/p' "$junction"; }
          old="$(commit)"
          just bst source track fsdk-containers.bst
          new="$(commit)"
          [[ "$old" =~ ^[0-9a-f]{40}$ && "$new" =~ ^[0-9a-f]{40}$ ]]
          # Keep the ref a plain commit: git_repo's project-wide git-describe
          # format would otherwise rewrite the same commit as a change.
          git checkout -- "$junction"
          if [[ "$new" == "$old" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E "s/^( +ref: ).*$/\1${new}/" "$junction"
          # The image labels name the FSDK release the new base builds on;
          # rewriting them here keeps refs, metadata and labels in one proposal.
          oci=elements/oci/gutenprint-printer-app.bst
          read -r fsdk_version fsdk_ref <<< "$(scripts/fsdk-pin.sh "$new")"
          sed -i -E \
            -e "s/^( +'io\.projectbluefin\.fsdk\.version': ').*'$/\1${fsdk_version}'/" \
            -e "s/^( +'io\.projectbluefin\.fsdk\.ref': ').*'$/\1${fsdk_ref}'/" \
            "$oci"
          tests/source-pins.sh
          {
            echo "changed=true"
            echo "old=${old}"
            echo "new=${new}"
            echo "fsdk_version=${fsdk_version}"
            echo "fsdk_ref=${fsdk_ref}"
          } >> "$GITHUB_OUTPUT"
      - name: Mint Mergeraptor token
        if: steps.track.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          # A fork's per-repo installation lookup (GET /repos/{owner}/{repo}/installation) 404s;
          # owner: switches to the owner-level lookup, which resolves from a fork (fsdk-containers#331).
          owner: ${{ github.repository_owner }}
      - name: Propose the update
        if: steps.track.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          OLD: ${{ steps.track.outputs.old }}
          NEW: ${{ steps.track.outputs.new }}
          FSDK_VERSION: ${{ steps.track.outputs.fsdk_version }}
          FSDK_REF: ${{ steps.track.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          branch=deps/fsdk-containers
          title="chore(deps): update fsdk-containers to ${NEW:0:12}"
          git config user.name 'mergeraptor[bot]'
          git config user.email '267480593+mergeraptor[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git add elements/fsdk-containers.bst elements/oci/gutenprint-printer-app.bst
          git commit --signoff -m "$title"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push --force "https://github.com/${REPOSITORY}.git" "HEAD:refs/heads/$branch"
          body="$(printf '%s\n\n%s' \
            "Moves the fsdk-containers junction (FSDK and the shared printing base) from ${OLD} to ${NEW}: https://github.com/projectbluefin/fsdk-containers/compare/${OLD}...${NEW}" \
            "Rewrites the image labels \`io.projectbluefin.fsdk.version\`/\`io.projectbluefin.fsdk.ref\` to FSDK ${FSDK_VERSION} at ${FSDK_REF}, the release this fsdk-containers commit builds on. \`tests/source-pins.sh\` (part of \`just validate\`) checks that agreement on this pull request; the merge queue's full native image build and socket print decide whether it lands.")"
          if existing="$(gh pr list --head "$branch" --base testing --state open --json number --jq '.[0].number')" && [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            printf 'Updated dependency PR #%s\n' "$existing"
          else
            gh pr create --base testing --head "$branch" --title "$title" --body "$body"
          fi
