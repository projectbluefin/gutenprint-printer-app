name: Publish Gutenprint OCI image

# Every push to testing that builds and passes `just verify` on both arches
# publishes a signed multiarchitecture index. Rolling back means reverting the
# offending pull request; the next publish moves the tags back.
on:
  push:
    branches: [testing]
  workflow_dispatch:

concurrency:
  group: oci-gutenprint-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metadata:
    # workflow_dispatch from any other branch must never publish.
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
      gutenprint_ref: ${{ steps.release.outputs.gutenprint_ref }}
      fsdk_version: ${{ steps.release.outputs.fsdk_version }}
      fsdk_ref: ${{ steps.release.outputs.fsdk_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check pinned sources
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tests/source-pins.sh
          version="$(sed -n 's/^  gutenprint-version: "\([^"]*\)"$/\1/p' include/source-pins.yml)"
          gutenprint_ref="$(sed -n 's/^  gutenprint-ref: "\([0-9a-f]*\)"$/\1/p' include/source-pins.yml)"
          # FSDK labels name the release the junctioned fsdk-containers commit
          # builds on, so a bare Renovate junction bump needs no other edit.
          junction_ref="$(sed -n -E 's/^ +ref: .*([0-9a-f]{40})$/\1/p' elements/fsdk-containers.bst)"
          read -r fsdk_version fsdk_ref <<< "$(scripts/fsdk-pin.sh "$junction_ref")"
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "gutenprint_ref=$gutenprint_ref"
            echo "fsdk_version=$fsdk_version"
            echo "fsdk_ref=$fsdk_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      # Every bst call, including those inside just recipes, uses the CI
      # user config (source cache override, network retries).
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      # Restore only: bst-cache.yml on testing is the only writer.
      - name: Compute BuildStream cache key
        id: bst-key
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'gutenprint-printer-app.c', 'gutenprint-printer-app.1', 'gutenprint-printer-app.service', 'testpage.ps') }}
        run: echo "hash=${INPUTS_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            bst-v1-${{ matrix.arch }}-${{ steps.bst-key.outputs.hash }}-
            bst-v1-${{ matrix.arch }}-
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Build image
        run: just bst --network-retries 5 build oci/gutenprint-printer-app.bst
      - name: Build and verify full OCI job to real socket sink
        run: just verify
      - name: Validate source labels before any registry write
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          GUTENPRINT_REF: ${{ needs.metadata.outputs.gutenprint_ref }}
        run: |
          set -euo pipefail
          podman inspect ghcr.io/projectbluefin/gutenprint-printer-app:build \
            --format '{{json .Config.Labels}}' |
            jq -e --arg version "$VERSION" --arg gutenprint "$GUTENPRINT_REF" \
              '."org.opencontainers.image.version" == $version and
               ."io.projectbluefin.gutenprint.ref" == $gutenprint'
      - name: Attach commit and FSDK metadata
        env:
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          image=ghcr.io/projectbluefin/gutenprint-printer-app:build
          container="$(podman create "$image")"
          trap 'podman rm "$container" >/dev/null 2>&1 || true' EXIT
          podman commit --format oci \
            --change "LABEL org.opencontainers.image.revision=$REVISION" \
            --change "LABEL org.opencontainers.image.created=$CREATED" \
            --change "LABEL io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --change "LABEL io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "$container" "$image"
      - name: Export verified architecture image
        run: podman save --format oci-archive --output gutenprint-${{ matrix.arch }}.tar ghcr.io/projectbluefin/gutenprint-printer-app:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gutenprint-${{ matrix.arch }}
          path: gutenprint-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gutenprint-*
          merge-multiple: true
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry and BuildStream host tools
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Generate BuildStream-native SPDX SBOM
        run: just sbom
      # Everything is pushed, signed, attested and verified by digest; the
      # tags are created only in the final step, so a failed publish never
      # leaves a tagged, unsigned image behind.
      - name: Publish architecture manifests and annotated index by digest
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          GUTENPRINT_REF: ${{ needs.metadata.outputs.gutenprint_ref }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gutenprint-printer-app"
          authfile="$HOME/.docker/config.json"
          # sha-<commit> is the one immutable tag; the version tags move.
          tag="sha-${REVISION}"
          if probe="$(skopeo inspect --authfile "$authfile" "docker://${image}:${tag}" 2>&1)"; then
            printf 'Refusing to overwrite immutable tag %s:%s\n' "$image" "$tag" >&2
            exit 1
          elif [[ "${probe,,}" != *'manifest unknown'* && "${probe,,}" != *'name unknown'* ]]; then
            printf 'Could not prove %s:%s is absent: %s\n' "$image" "$tag" "$probe" >&2
            exit 1
          fi
          sources=()
          for arch in amd64 arm64; do
            name="$([[ "$arch" == amd64 ]] && echo x86_64 || echo aarch64)"
            archive="gutenprint-${name}.tar"
            layout="$(tar -xOf "$archive" index.json)"
            jq -e '.manifests | length == 1' <<< "$layout" >/dev/null
            digest="$(jq -r '.manifests[0].digest' <<< "$layout")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            oras copy --from-oci-layout "${archive}@${digest}" "${image}@${digest}"
            source="${image}@${digest}"
            actual="$(skopeo inspect --no-tags --authfile "$authfile" "docker://${source}" | jq -r .Architecture)"
            [[ "$actual" == "$arch" ]]
            config="$(skopeo inspect --config --authfile "$authfile" "docker://${source}")"
            jq -e \
              --arg arch "$arch" --arg version "$VERSION" --arg revision "$REVISION" \
              --arg created "$CREATED" --arg gutenprint "$GUTENPRINT_REF" \
              --arg fsdk_version "$FSDK_VERSION" --arg fsdk_ref "$FSDK_REF" \
              --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
              '.architecture == $arch and
               .config.User == "65532:65532" and
               .config.Entrypoint == ["/usr/bin/catatonit", "--", "/usr/bin/bash", "/usr/libexec/gutenprint-printer-app/container-entrypoint"] and
               .config.Labels["org.opencontainers.image.title"] == "gutenprint-printer-app" and
               .config.Labels["org.opencontainers.image.source"] == $source_url and
               .config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.created"] == $created and
               .config.Labels["io.projectbluefin.gutenprint.ref"] == $gutenprint and
               .config.Labels["io.projectbluefin.fsdk.version"] == $fsdk_version and
               .config.Labels["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$config"
            sources+=("$source")
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
          docker buildx imagetools create --dry-run \
            --tag "${image}:${VERSION}" \
            --annotation 'index:org.opencontainers.image.title=gutenprint-printer-app' \
            --annotation 'index:org.opencontainers.image.description=Gutenprint Printer Application built from freedesktop-sdk' \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation 'index:org.opencontainers.image.licenses=Apache-2.0 AND GPL-2.0-or-later' \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:io.projectbluefin.gutenprint.ref=$GUTENPRINT_REF" \
            --annotation "index:io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --annotation "index:io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "${sources[@]}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "${image}@${digest}" index.json
          [[ "$(skopeo inspect --raw --authfile "$authfile" "docker://${image}@${digest}" | sha256sum | cut -d' ' -f1)" == "${digest#sha256:}" ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign index and architecture manifests and attach signed SPDX SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.index.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=gutenprint-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            gutenprint-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom_digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Verify public OCI release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.index.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom_digest }}
          X86_64_DIGEST: ${{ steps.index.outputs.x86_64_digest }}
          AARCH64_DIGEST: ${{ steps.index.outputs.aarch64_digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GUTENPRINT_REF: ${{ needs.metadata.outputs.gutenprint_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@${GITHUB_REF}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${SBOM_DIGEST}"
          for arch_digest in "$X86_64_DIGEST" "$AARCH64_DIGEST"; do
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${arch_digest}"
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" |
            jq -e --arg digest "$SBOM_DIGEST" '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == 'amd64 arm64' ]]
          [[ "$(jq -r '[.manifests[].digest] | sort | join(" ")' <<< "$raw")" == "$(printf '%s\n' "$X86_64_DIGEST" "$AARCH64_DIGEST" | sort | paste -sd ' ')" ]]
          jq -e --arg version "$VERSION" --arg gutenprint "$GUTENPRINT_REF" \
            '.annotations["org.opencontainers.image.title"] == "gutenprint-printer-app" and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["io.projectbluefin.gutenprint.ref"] == $gutenprint' <<< "$raw"
      - name: Tag the verified image
        env:
          IMAGE: ${{ steps.index.outputs.image }}
          DIGEST: ${{ steps.index.outputs.digest }}
          X86_64_DIGEST: ${{ steps.index.outputs.x86_64_digest }}
          AARCH64_DIGEST: ${{ steps.index.outputs.aarch64_digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          oras tag "${IMAGE}@${X86_64_DIGEST}" "${VERSION}-x86_64"
          oras tag "${IMAGE}@${AARCH64_DIGEST}" "${VERSION}-aarch64"
          oras tag "${IMAGE}@${DIGEST}" "sha-${REVISION}" "${VERSION}" stable
          [[ "$(skopeo inspect --raw "docker://${IMAGE}:${VERSION}" | sha256sum | cut -d' ' -f1)" == "${DIGEST#sha256:}" ]]
